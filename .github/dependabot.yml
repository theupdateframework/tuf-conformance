version: 2
updates:

- package-ecosystem: "uv"
  directory: "/"
  versioning-strategy: lockfile-only
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    python-dependencies:
      patterns:
        - "*"
      update-types:
        - "minor"
        - "patch"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
  groups:
    action-dependencies:
      patterns:
        - "*"
      update-types:
        - "minor"
        - "patch"

- package-ecosystem: "gomod"
  directory: "/clients/go-tuf/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
