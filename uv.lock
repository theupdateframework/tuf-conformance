source = { editable = "." }
dependencies = [
    { name = "pytest" },
    { name = "pytest-json-report" },
    { name = "securesystemslib", extra = ["crypto"] },
    { name = "tuf" },
]

[package.optional-dependencies]
lint = [
    { name = "mypy" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "mypy", marker = "extra == 'lint'" },
    { name = "pytest" },
    { name = "pytest-json-report" },
    { name = "ruff", marker = "extra == 'lint'" },
    { name = "securesystemslib", extras = ["crypto"], specifier = ">=1.4.0" },
    { name = "tuf", specifier = ">=7.0.0" },
]
provides-extras = ["lint"]

